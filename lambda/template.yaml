AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MIF FAQ Chat Free - standalone public FAQ sample

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: !Ref DynamoDBEndpoint
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: API stage name and Lambda runtime environment

  FaqTableNamespace:
    Type: String
    Default: lite
    MinLength: 1
    MaxLength: 32
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: >-
      Must contain only lowercase letters, digits, and hyphens, and must start
      and end with a letter or digit
    Description: Stable namespace that isolates the three FAQ DynamoDB tables

  DynamoDBEndpoint:
    Type: String
    Default: ''
    Description: DynamoDB Local endpoint; leave empty for AWS

  FaqPortsProfile:
    Type: String
    Default: free
    AllowedValues:
      - free
      - remote
    Description: >-
      The public package defaults to its free lexical retrieval profile; remote delegates
      the managed RAG operations through cross-account AssumeRole and SigV4.

  FaqRemoteRagBaseUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[^\s]+$'
    ConstraintDescription: Must be empty or an HTTPS URL
    Description: >-
      HTTPS base URL of the MIF Remote RAG API, without an operation suffix. Required
      when FaqPortsProfile is remote.

  FaqRemoteRagRoleArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
    ConstraintDescription: Must be empty or an exact IAM role ARN
    Description: >-
      Exact cross-account MIF invoker role assumed before SigV4 signing. Required when
      FaqPortsProfile is remote and accepted only together with FaqRemoteRagExternalId.

  FaqRemoteRagExternalId:
    Type: String
    Default: ''
    NoEcho: true
    MaxLength: 1224
    AllowedPattern: '^$|^[A-Za-z0-9_+=,.@:/-]{2,}$'
    ConstraintDescription: Must be empty or an STS ExternalId of 2-1224 characters
    Description: >-
      Tenant-specific ExternalId passed to STS AssumeRole. Required when FaqPortsProfile
      is remote and accepted only together with FaqRemoteRagRoleArn.

  AnthropicApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional API key; empty uses the deterministic grounded demo generator

  FaqChatCorsOrigin:
    Type: String
    Default: '*'
    Description: Exact browser origin for deployment; wildcard is intended for local trial only

Rules:
  FaqRemoteProfileRequiresConfiguration:
    RuleCondition: !Equals [!Ref FaqPortsProfile, remote]
    Assertions:
      - Assert: !Not [!Equals [!Ref FaqRemoteRagBaseUrl, '']]
        AssertDescription: FaqRemoteRagBaseUrl is required when FaqPortsProfile is remote
      - Assert: !Not [!Equals [!Ref FaqRemoteRagRoleArn, '']]
        AssertDescription: FaqRemoteRagRoleArn is required when FaqPortsProfile is remote
      - Assert: !Not [!Equals [!Ref FaqRemoteRagExternalId, '']]
        AssertDescription: FaqRemoteRagExternalId is required when FaqPortsProfile is remote

  FaqRemoteRoleAndExternalIdMustBePaired:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref FaqRemoteRagRoleArn, '']
            - !Equals [!Ref FaqRemoteRagExternalId, '']
          - !And
            - !Not [!Equals [!Ref FaqRemoteRagRoleArn, '']]
            - !Not [!Equals [!Ref FaqRemoteRagExternalId, '']]
        AssertDescription: >-
          FaqRemoteRagRoleArn and FaqRemoteRagExternalId must both be set or both be empty

  # remote 設定値がどれか非空なら profile=remote を強制する。これが無いと free + remote3値 という
  # 組み合わせが通り、free の字句検索で静かに動き続ける（唯一残る実行時無症状のフォールバック）。
  # 二段 onboarding の stage1 は3値とも空なので RuleCondition は成立せず競合しない。
  FaqRemoteConfigRequiresRemoteProfile:
    RuleCondition: !Not
      - !And
        - !Equals [!Ref FaqRemoteRagBaseUrl, '']
        - !Equals [!Ref FaqRemoteRagRoleArn, '']
        - !Equals [!Ref FaqRemoteRagExternalId, '']
    Assertions:
      - Assert: !Equals [!Ref FaqPortsProfile, remote]
        AssertDescription: >-
          FaqRemoteRag* settings require FaqPortsProfile=remote so the shell does not silently
          serve free lexical results while remote is configured

Conditions:
  UseFaqRemoteRagAssumeRole: !And
    - !Equals [!Ref FaqPortsProfile, remote]
    - !Not [!Equals [!Ref FaqRemoteRagRoleArn, '']]

Resources:
  FaqHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !Ref FaqChatCorsOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
      RouteSettings:
        'POST /faq-chat':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2

  SettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-${FaqTableNamespace}-Settings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH

  KnowledgeEntriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-${FaqTableNamespace}-KnowledgeEntries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: entryId
          AttributeType: S
        - AttributeName: topicKey
          AttributeType: S
        - AttributeName: syncQueueStatus
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: entryId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: topicKey-index
          KeySchema:
            - AttributeName: topicKey
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: syncQueueStatus-updatedAt-index
          KeySchema:
            - AttributeName: syncQueueStatus
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: category-status-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FaqQaLogsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-${FaqTableNamespace}-FaqQaLogs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dateBucket
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
      KeySchema:
        - AttributeName: dateBucket
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      # This free stack intentionally has no StreamSpecification or archive/notification worker.

  FaqChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-faq-chat-free
      CodeUri: functions/faq-chat/
      Handler: bootstrap.handler
      Timeout: 28
      Description: Standalone public FAQ using the free retrieval and generation adapters
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          FAQ_PORTS_PROFILE: !Ref FaqPortsProfile
          FAQ_REMOTE_RAG_BASE_URL: !Ref FaqRemoteRagBaseUrl
          FAQ_REMOTE_RAG_ROLE_ARN: !Ref FaqRemoteRagRoleArn
          FAQ_REMOTE_RAG_EXTERNAL_ID: !Ref FaqRemoteRagExternalId
          FAQ_CORS_ORIGIN: !Ref FaqChatCorsOrigin
          FAQ_TABLE_NAME_PREFIX: !Sub ${Environment}-${FaqTableNamespace}
          FAQ_SETTINGS_TABLE_NAME: !Ref SettingsTable
          FAQ_KNOWLEDGE_ENTRIES_TABLE_NAME: !Ref KnowledgeEntriesTable
          FAQ_QA_LOGS_TABLE_NAME: !Ref FaqQaLogsTable
      Events:
        FaqChatApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref FaqHttpApi
            Path: /faq-chat
            Method: POST
        FaqChatOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref FaqHttpApi
            Path: /faq-chat
            Method: OPTIONS
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt KnowledgeEntriesTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt FaqQaLogsTable.Arn
        - !If
          - UseFaqRemoteRagAssumeRole
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref FaqRemoteRagRoleArn
          - !Ref AWS::NoValue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - bootstrap.ts
        External:
          - '@aws-sdk/*'

Outputs:
  FaqApiUrl:
    Description: FAQ API base URL
    Value: !Sub https://${FaqHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}
  FaqChatCallerRoleArn:
    Description: Caller role ARN to register in the MIF Remote RAG trust policy
    Value: !GetAtt FaqChatFunctionRole.Arn
  FaqSettingsTableName:
    Description: Exact DynamoDB table name for FAQ settings
    Value: !Ref SettingsTable
  FaqKnowledgeEntriesTableName:
    Description: Exact DynamoDB table name for public FAQ knowledge entries
    Value: !Ref KnowledgeEntriesTable
  FaqQaLogsTableName:
    Description: Exact DynamoDB table name for FAQ question and answer logs
    Value: !Ref FaqQaLogsTable
